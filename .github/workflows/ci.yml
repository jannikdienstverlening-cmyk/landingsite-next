name: quality

on:
  pull_request:
  push:
    branches: [master, codex/subscriptions-security]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3001
      STRIPE_BUILD_PRICE_STARTER: price_test_starter
      STRIPE_BUILD_PRICE_PRO: price_test_pro
      STRIPE_BUILD_PRICE_PREMIUM: price_test_premium
      STRIPE_PRICE_WEBSITE_MANAGEMENT: price_test_management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run content:lint
      - run: npm test
      - run: npm run build
      - run: npm run content:lint:build
      - name: Smoke test production routes
        run: |
          npm start -- --hostname 127.0.0.1 --port 3001 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:3001/ >/dev/null && break; sleep 1; done
          npm run smoke

