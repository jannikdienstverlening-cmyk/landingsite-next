name: quality

on:
  pull_request:
  push:
    branches: [master, codex/subscriptions-security, 'codex/quality-*']

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3001
      STRIPE_PRICE_WEBSITE_MANAGEMENT: price_testmanagement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run content:lint
      - run: npm test
      - run: npm run audit:production
      - run: npm run build
      - run: npm run content:lint:build
      - name: Browser tests against the production build
        env:
          PLAYWRIGHT_PRODUCTION: '1'
        run: npm run test:e2e -- --update-snapshots=none
      - name: Smoke test production routes
        run: |
          npm start -- --hostname 127.0.0.1 --port 3001 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:3001/ >/dev/null && break; sleep 1; done
          npm run smoke
      - name: Bewaar browserrapport bij fouten
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
